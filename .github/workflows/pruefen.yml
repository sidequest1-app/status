name: Erreichbarkeit prüfen
# Läuft nur im ÖFFENTLICHEN Status-Repo (dort sind Actions-Minuten auf Standard-Runnern kostenlos und unbegrenzt).
# Nie ins private App-Repo unter .github/workflows kopieren: Der Dauerlauf würde dort das ganze Kontingent verbrauchen.
#
# Dauerlauf: Ein Lauf bleibt gut 5,5 Stunden aktiv und prüft darin alle 10 Minuten (scripts/dauerlauf.sh).
# Der Zeitplan stößt stündlich an (nicht zur vollen Stunde, da ist GitHub am vollsten). Läuft schon ein Lauf,
# wartet der neue und übernimmt danach; weitere Anstöße ersetzen den wartenden (erscheinen als „cancelled“).
# So wird durchgehend geprüft, auch wenn GitHub einzelne Zeitplan-Anstöße verzögert oder streicht.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: pruefen
  cancel-in-progress: false

# Nur der eingebaute, kurzlebige GITHUB_TOKEN, keine Secrets: Stand speichern (contents) und Ausfall-Issues (issues).
permissions:
  contents: write
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Portal und API prüfen (alle 10 Minuten, gut 5,5 Stunden lang)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LAUFZEIT_MINUTEN: "340"
          ABSTAND_SEKUNDEN: "600"
        # Kopie ausführen: Der Dauerlauf holt regelmäßig den neuesten Stand (git pull), auch des Skripts selbst.
        run: cp scripts/dauerlauf.sh "$RUNNER_TEMP/dauerlauf.sh" && bash "$RUNNER_TEMP/dauerlauf.sh"
