name: Erreichbarkeit prüfen
# Läuft nur im ÖFFENTLICHEN Status-Repo (dort sind Actions-Minuten auf Standard-Runnern kostenlos und unbegrenzt).
# Nie ins private App-Repo unter .github/workflows kopieren: Alle 10 Minuten wären dort etwa 4.300 Minuten im Monat.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig (sonst Konflikte beim Speichern).
concurrency:
  group: pruefen
  cancel-in-progress: false

# Nur der eingebaute, kurzlebige GITHUB_TOKEN, keine Secrets: Stand speichern (contents) und Ausfall-Issues (issues).
permissions:
  contents: write
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Portal und API prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/pruefen.mjs
      - name: Stand speichern
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Status $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase
          done
          exit 1
